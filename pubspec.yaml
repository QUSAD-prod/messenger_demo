name: messenger_demo
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.1.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^10.0.1
  equatable: ^2.0.7
  firebase_auth: ^5.5.1
  firebase_core: ^3.12.1
  flutter_bloc: ^9.1.0
  flutter_svg: ^2.0.17
  get_it: ^8.0.3
  hive_flutter: ^1.1.0
  talker_bloc_logger: ^4.6.14
  talker_flutter: ^4.6.14
  package_info_plus: ^8.3.0
  google_sign_in: ^6.3.0
  flutter_spinkit: ^5.2.1
  flutter_svg_provider: ^1.0.7

dependency_overrides:
  source_gen: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.0.1
  build_runner: ^2.4.15
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/svg/

  fonts:
    - family: Gilroy
      fonts:
        - asset: fonts/Gilroy-Thin.ttf
          weight: 100
        - asset: fonts/Gilroy-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: fonts/Gilroy-UltraLight.ttf
          weight: 200
        - asset: fonts/Gilroy-UltraLightItalic.ttf
          weight: 200
          style: italic
        - asset: fonts/Gilroy-Light.ttf
          weight: 300
        - asset: fonts/Gilroy-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/Gilroy-Regular.ttf
          weight: 400
        - asset: fonts/Gilroy-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: fonts/Gilroy-Medium.ttf
          weight: 500
        - asset: fonts/Gilroy-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: fonts/Gilroy-Semibold.ttf
          weight: 600
        - asset: fonts/Gilroy-SemiboldItalic.ttf
          weight: 600
          style: italic
        - asset: fonts/Gilroy-Bold.ttf
          weight: 700
        - asset: fonts/Gilroy-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: fonts/Gilroy-Extrabold.ttf
          weight: 800
        - asset: fonts/Gilroy-ExtraboldItalic.ttf
          weight: 800
          style: italic
        - asset: fonts/Gilroy-Black.ttf
          weight: 900
        - asset: fonts/Gilroy-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: fonts/Gilroy-Heavy.ttf
          weight: 900
        - asset: fonts/Gilroy-HeavyItalic.ttf
          weight: 900
          style: italic
